<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حسابی کڕین و فرۆشتنی RMB</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#ffffff;--line:#ece8df;--text:#1c1917;--muted:#78716c;--ink:#0f3d33;--ink2:#14594a;--gold:#c8962e;--green:#15803d;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 50% -200px,#e7efe9 0%,var(--bg) 60%);color:var(--text);font-family:Vazirmatn,system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:18px 14px 48px}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,var(--ink) 0%,var(--ink2) 100%);color:#fff;border-radius:24px;padding:20px 20px 22px;margin-bottom:14px;box-shadow:0 14px 30px -12px rgba(15,61,51,.45)}
.hero::after{content:"¥";position:absolute;left:-10px;bottom:-60px;font-size:220px;font-weight:800;color:rgba(255,255,255,.06);line-height:1}
.top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand span{color:#f3c969}
.mkt{text-align:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 12px;line-height:1.3}
.ml{font-size:10.5px;color:#cfe3dc}
.mv{font-size:18px;font-weight:800;color:#f3c969;direction:ltr}
.mv small{font-size:11px;font-weight:600;color:#cfe3dc}
.md{font-size:10px;color:#a7c7bd;direction:ltr}
.chip{font-size:11.5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;direction:ltr}
.profit .l{font-size:13px;color:#cfe3dc}
.profit .v{font-size:40px;font-weight:800;direction:ltr;text-align:right;line-height:1.25}
.profit .p{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;direction:ltr;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.14)}
.hero .pos{color:#86efac}.hero .neg{color:#fca5a5}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(28,25,23,.04),0 6px 18px -10px rgba(28,25,23,.12)}
.ctitle{font-size:13px;font-weight:700;color:var(--ink2);margin:0 0 12px;display:flex;align-items:center;gap:8px}
.ctitle::before{content:"";width:6px;height:16px;border-radius:3px;background:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:12px;font-weight:500}
.grid2 label{margin-bottom:0}
.field{position:relative;margin-top:5px}
input{width:100%;background:#faf9f6;border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:inherit;font-size:19px;font-weight:700;direction:ltr;text-align:left;transition:border-color .15s,box-shadow .15s,background .15s}
.field input{padding-right:44px}
.unit{direction:ltr;position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--gold);pointer-events:none}
input:focus{outline:none;border-color:var(--ink2);background:#fff;box-shadow:0 0 0 4px rgba(20,89,74,.12)}
input.txt{direction:rtl;text-align:right;font-size:15px;font-weight:500}
.big input{font-size:24px;padding:14px 14px;padding-right:44px}
.res{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px dashed var(--line);font-size:14px;color:#44403c}
.res:last-of-type{border-bottom:none}
.res b{direction:ltr;font-size:16px;color:var(--text)}
.res.hl b{color:var(--ink2)}
.hint{color:var(--muted);font-size:12px;margin-top:8px;background:#fbf6ea;border-radius:10px;padding:8px 10px}
.pos{color:var(--green)}.neg{color:var(--red)}
button{font:inherit;font-weight:800;font-size:16px;width:100%;border:none;border-radius:16px;padding:14px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#d7a43a,#b9811c);box-shadow:0 10px 20px -10px rgba(185,129,28,.7);transition:transform .1s}
button:active{transform:scale(.98)}
button:disabled{opacity:.6}
.msg{text-align:center;font-size:13px;color:var(--muted);min-height:20px;margin-top:8px}
#rcImg{display:none;width:100%;border-radius:14px;margin-top:12px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="top"><div class="brand">حسابی <span>RMB</span></div><div class="mkt"><div class="ml">نرخی بازار</div><div class="mv" id="mkt">… <small>¥/$</small></div><div class="md" id="mktd">loading</div></div></div>
    <div class="profit">
      <div class="l">قازانج</div>
      <div class="v" id="profit">—</div>
      <div class="p" id="ppct"></div>
    </div>
  </div>

  <div class="card">
    <div class="ctitle">نرخەکان</div>
    <div class="grid2">
      <label>نرخی کڕین<div class="field"><input id="buy" inputmode="decimal" value="7.10"><span class="unit">¥/$</span></div></label>
      <label>نرخی فرۆشتن<div class="field"><input id="sell" inputmode="decimal" value="7.00"><span class="unit">¥/$</span></div></label>
    </div>
    <label style="margin-top:12px">زیادەی USDT<div class="field"><input id="pct" inputmode="decimal" value="1"><span class="unit">%</span></div></label>
    <label class="big" style="margin-bottom:0">بڕ بە یوان<div class="field"><input id="amt" inputmode="decimal" value="71000"><span class="unit">¥</span></div></label>
  </div>

  <div class="card">
    <div class="ctitle">ئەنجام</div>
    <div class="res"><span>بەرامبەر بە دۆلار</span><b id="usd">—</b></div>
    <div class="res"><span>USDT کە دەیدەیت</span><b id="paid">—</b></div>
    <div class="res hl"><span>دۆلار کە لە فرۆشتن وەریدەگریت</span><b id="got">—</b></div>
    <div class="res"><span>نرخی بێ‌زیان بۆ فرۆشتن</span><b id="be">—</b></div>
    <div class="hint">نرخی فرۆشتن دەبێت لە نرخی بێ‌زیان کەمتر بێت تا قازانج بکەیت.</div>
  </div>

  <div class="card">
    <div class="ctitle">وەسڵ</div>
    <label style="margin-bottom:12px">ناو / تێبینی (ئارەزوومەندانە)<div class="field"><input id="note" class="txt" placeholder="ناوی کڕیار یان فرۆشیار…"></div></label>
    <button id="rcBtn">⬇ داگرتنی وەسڵ (وێنە)</button>
    <div class="msg" id="msg"></div>
    <img id="rcImg" alt="وەسڵ">
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const n=v=>{const x=parseFloat(String(v).replace(/,/g,''));return isFinite(x)?x:NaN};
const f=(x,d=2)=>isFinite(x)?x.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const sg=x=>isFinite(x)?(x>=0?'+':''):'';

function vals(){
  const buy=n($('buy').value), p=n($('pct').value)||0, sell=n($('sell').value), rmb=n($('amt').value);
  const usd=rmb/buy;                 // $ value at buy rate
  const paid=usd*(1+p/100);          // USDT paid
  const got=rmb/sell;                // $ received on sale
  const pr=got-paid;
  return {buy,p,sell,rmb,usd,paid,got,pr,pp:pr/paid*100,be:buy/(1+p/100)};
}
function calc(){
  const v=vals();
  $('usd').textContent='$ '+f(v.usd);
  $('paid').textContent=f(v.paid)+' USDT';
  $('got').textContent='$ '+f(v.got);
  $('be').textContent=f(v.be,4);
  const ok=isFinite(v.pr), cls=ok?(v.pr>=0?'pos':'neg'):'';
  $('profit').textContent=ok?sg(v.pr)+f(v.pr):'—'; $('profit').className='v '+cls;
  $('ppct').textContent=ok?sg(v.pp)+f(v.pp)+'%':''; $('ppct').className='p '+cls;
}
['buy','pct','sell','amt'].forEach(id=>$(id).addEventListener('input',calc));
calc();

/* ---------- Receipt ---------- */
const pad=x=>String(x).padStart(2,'0');
async function drawReceipt(){
  try{ await Promise.all([document.fonts.load('400 30px Vazirmatn'),document.fonts.load('700 30px Vazirmatn'),document.fonts.load('800 30px Vazirmatn')]); }catch(e){}
  const v=vals(), now=new Date();
  const date=`${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())}`;
  const time=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const no=`RMB-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const note=$('note').value.trim();

  const rows=[
    ['بڕی یوان','¥ '+f(v.rmb)],
    ['نرخی کڕین (¥/$)',f(v.buy,4)],
    ['بەرامبەر بە دۆلار','$ '+f(v.usd)],
    ['زیادەی USDT',f(v.p)+'%'],
    ['USDT ی دراو',f(v.paid)+' USDT'],
    ['نرخی فرۆشتن (¥/$)',f(v.sell,4)],
    ['دۆلاری وەرگیراو','$ '+f(v.got)],
    ['نرخی بێ‌زیان (¥/$)',f(v.be,4)],
  ];
  const W=1080, P=70, rowH=78;
  const H=430+(note?80:0)+rows.length*rowH+300;
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const F=(w,s)=>`${w} ${s}px Vazirmatn, sans-serif`;
  // background
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  x.fillStyle='#0f3d33'; x.fillRect(0,0,W,230);
  x.fillStyle='#c8962e'; x.fillRect(0,230,W,8);
  x.direction='rtl'; x.textBaseline='middle';
  // header
  x.textAlign='right'; x.fillStyle='#ffffff'; x.font=F(800,58); x.fillText('وەسڵی مامەڵەی RMB',W-P,95);
  x.font=F(400,30); x.fillStyle='#cbd5e1'; x.fillText('کڕین بە USDT — فرۆشتن بە دۆلار',W-P,165);
  x.direction='ltr'; x.textAlign='left'; x.fillStyle='#f3c969'; x.font=F(800,64); x.fillText('¥',P,110);
  // meta
  let y=300;
  const meta=(label,val)=>{ x.direction='rtl'; x.textAlign='right'; x.fillStyle='#6b7280'; x.font=F(500,30); x.fillText(label,W-P,y);
    x.direction='ltr'; x.textAlign='left'; x.fillStyle='#111827'; x.font=F(700,30); x.fillText(val,P,y); y+=56; };
  meta('بەروار',date+'   '+time);
  meta('ژمارەی وەسڵ',no);
  if(note){ x.direction='rtl'; x.textAlign='right'; x.fillStyle='#6b7280'; x.font=F(500,30); x.fillText('ناو / تێبینی',W-P,y);
    x.textAlign='left'; x.fillStyle='#111827'; x.font=F(700,30); x.fillText(note,P,y); y+=56; }
  // dashed line
  const dash=yy=>{ x.strokeStyle='#d1d5db'; x.lineWidth=3; x.setLineDash([14,10]); x.beginPath(); x.moveTo(P,yy); x.lineTo(W-P,yy); x.stroke(); x.setLineDash([]); };
  y+=10; dash(y); y+=55;
  rows.forEach((r,i)=>{
    if(i%2===0){ x.fillStyle='#f6f7f9'; x.fillRect(P-20,y-rowH/2,W-2*P+40,rowH); }
    x.direction='rtl'; x.textAlign='right'; x.fillStyle='#374151'; x.font=F(500,32); x.fillText(r[0],W-P,y);
    x.direction='ltr'; x.textAlign='left'; x.fillStyle='#111827'; x.font=F(700,34); x.fillText(r[1],P,y);
    y+=rowH;
  });
  y+=10; dash(y-rowH/2+10);
  // profit box
  const pos=v.pr>=0, bx=y+10, bh=170;
  x.fillStyle=pos?'#ecfdf3':'#fef2f2'; x.strokeStyle=pos?'#22c55e':'#ef4444'; x.lineWidth=4;
  if(x.roundRect){ x.beginPath(); x.roundRect(P-20,bx,W-2*P+40,bh,24); x.fill(); x.stroke(); } else { x.fillRect(P-20,bx,W-2*P+40,bh); x.strokeRect(P-20,bx,W-2*P+40,bh); }
  x.direction='rtl'; x.textAlign='right'; x.fillStyle='#374151'; x.font=F(700,38); x.fillText(pos?'قازانج':'زیان',W-P,bx+bh/2);
  x.direction='ltr'; x.textAlign='left'; x.fillStyle=pos?'#15803d':'#b91c1c'; x.font=F(800,56); x.fillText(sg(v.pr)+f(v.pr)+' $',P,bx+bh/2-18);
  x.font=F(500,30); x.fillText(sg(v.pp)+f(v.pp)+'%',P,bx+bh/2+42);
  // footer
  x.direction='rtl'; x.textAlign='center'; x.fillStyle='#9ca3af'; x.font=F(400,24);
  x.fillText('ئەم وەسڵە بە شێوەی ئۆتۆماتیکی دروستکراوە',W/2,H-50);
  return {canvas:c, name:`wasl-${no}.png`};
}


$('rcBtn').onclick=async()=>{
  const v=vals();
  if(!isFinite(v.pr)||!(v.rmb>0)){ $('msg').textContent='تکایە هەموو خانەکان پڕ بکەرەوە'; return; }
  $('rcBtn').disabled=true; $('msg').textContent='وەسڵ دروست دەکرێت…';
  const {canvas,name}=await drawReceipt();
  const url=canvas.toDataURL('image/png');
  $('rcImg').src=url; $('rcImg').style.display='block';
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  $('msg').textContent='وەسڵ داگیرا ✓ — ئەگەر دانەگیرا، پەنجە لەسەر وێنەکە ڕابگرە';
  $('rcBtn').disabled=false;
};

/* ---------- Live market rate ---------- */
async function getRate(){
  const srcs=[
    async()=>{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j.result!=='success')throw 0;return {rate:j.rates.CNY,time:new Date(j.time_last_update_unix*1000)};},
    async()=>{const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json');const j=await r.json();return {rate:j.usd.cny,time:new Date(j.date)};}
  ];
  for(const s of srcs){ try{ const d=await s(); if(d.rate>0) return d; }catch(e){} }
  return null;
}
async function updateRate(){
  const d=await getRate();
  if(!d){ $('mktd').textContent='نەهات'; return; }
  $('mkt').innerHTML=d.rate.toFixed(4)+' <small>¥/$</small>';
  const t=d.time;
  $('mktd').textContent=`${t.getFullYear()}/${pad(t.getMonth()+1)}/${pad(t.getDate())}`;
}
updateRate();
setInterval(updateRate,10*60*1000);
</script>
</body>
</html>
